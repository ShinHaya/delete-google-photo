name: Codex Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

jobs:
  skip-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      draft: ${{ steps.check.outputs.draft }}
      base_ref: ${{ steps.check.outputs.base_ref }}
      head_ref: ${{ steps.check.outputs.head_ref }}
      head_sha: ${{ steps.check.outputs.head_sha }}
    steps:
      - name: Inspect pull request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}")
          BASE_REF=$(printf '%s' "$PR_JSON" | jq -r .base.ref)
          HEAD_SHA=$(printf '%s' "$PR_JSON" | jq -r .head.sha)
          HEAD_REF=$(printf '%s' "$PR_JSON" | jq -r .head.ref)
          DRAFT=$(printf '%s' "$PR_JSON" | jq -r .draft)

          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "head_ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"

          MESSAGE=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}" --jq .commit.message)
          if printf '%s' "$MESSAGE" | grep -F "[skip-review]" > /dev/null; then
            echo "Head commit carries [skip-review]; skipping review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  codex-review:
    needs: skip-check
    if: |
      needs.skip-check.outputs.skip != 'true' &&
      needs.skip-check.outputs.draft != 'true' &&
      startsWith(needs.skip-check.outputs.head_ref, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge

      - name: Pre-fetch base and head refs
        run: |
          git fetch --no-tags origin \
            ${{ needs.skip-check.outputs.base_ref }} \
            +refs/pull/${{ inputs.pr_number }}/head

      - name: Run Codex review
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          output-file: codex-output.md
          safety-strategy: drop-sudo
          sandbox: workspace-write

  post-feedback:
    runs-on: ubuntu-latest
    needs: codex-review
    if: needs.codex-review.outputs.final_message != ''
    permissions:
      pull-requests: write
      issues: write
    steps:
      # Post with a PAT when available. Comments authored by GITHUB_TOKEN
      # do not dispatch further workflow events (GitHub's recursion-prevention
      # rule), which would prevent the @claude mention below from triggering
      # .github/workflows/claude.yml. If AI_REVIEW_TRIGGER_PAT is unset we
      # fall back to GITHUB_TOKEN so the comment still posts for human
      # visibility, but the downstream @claude auto-fix will not fire.
      - name: Post Codex feedback
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AI_REVIEW_TRIGGER_PAT || github.token }}
          script: |
            const original = process.env.CODEX_FINAL_MESSAGE || "";
            const mention = "@claude 上記のレビュー指摘を反映する修正コミットを作成してください。修正後の commit message には必ず `[skip-review]` を含めてください。";
            const body = original.includes("@claude")
              ? original
              : `${original.trim()}\n\n${mention}\n`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ inputs.pr_number }}"),
              body,
            });
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex-review.outputs.final_message }}
