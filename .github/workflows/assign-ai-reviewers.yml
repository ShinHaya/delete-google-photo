name: Assign AI Reviewers

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

jobs:
  assign-reviewers:
    runs-on: ubuntu-latest
    steps:
      - name: Route reviewer request
        uses: actions/github-script@v7
        env:
          CODEX_AUTHOR_LOGINS: ${{ vars.CODEX_AUTHOR_LOGINS }}
          CLAUDE_AUTHOR_LOGINS: ${{ vars.CLAUDE_AUTHOR_LOGINS }}
          CODEX_REVIEWER_USERS: ${{ vars.CODEX_REVIEWER_USERS }}
          CLAUDE_REVIEWER_USERS: ${{ vars.CLAUDE_REVIEWER_USERS }}
          CODEX_REVIEWER_TEAMS: ${{ vars.CODEX_REVIEWER_TEAMS }}
          CLAUDE_REVIEWER_TEAMS: ${{ vars.CLAUDE_REVIEWER_TEAMS }}
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.notice('No pull_request payload found. Skipping.');
              return;
            }

            if (pr.draft) {
              core.notice(`PR #${pr.number} is a draft. Waiting until ready_for_review.`);
              return;
            }

            const parseCsv = (value) =>
              (value || '')
                .split(',')
                .map((entry) => entry.trim())
                .filter(Boolean);

            const hasAny = (items) => items.length > 0;

            const author = pr.user.login;
            const codexAuthors = parseCsv(process.env.CODEX_AUTHOR_LOGINS);
            const claudeAuthors = parseCsv(process.env.CLAUDE_AUTHOR_LOGINS);

            const isCodexAuthor = codexAuthors.includes(author);
            const isClaudeAuthor = claudeAuthors.includes(author);

            if (isCodexAuthor && isClaudeAuthor) {
              core.warning(
                `PR author ${author} matched both CODEX_AUTHOR_LOGINS and CLAUDE_AUTHOR_LOGINS. Skipping reviewer assignment.`
              );
              return;
            }

            let reviewerUsers = [];
            let reviewerTeams = [];
            let route = null;

            if (isCodexAuthor) {
              route = 'codex->claude';
              reviewerUsers = parseCsv(process.env.CLAUDE_REVIEWER_USERS);
              reviewerTeams = parseCsv(process.env.CLAUDE_REVIEWER_TEAMS);
            } else if (isClaudeAuthor) {
              route = 'claude->codex';
              reviewerUsers = parseCsv(process.env.CODEX_REVIEWER_USERS);
              reviewerTeams = parseCsv(process.env.CODEX_REVIEWER_TEAMS);
            } else {
              core.notice(
                `PR author ${author} did not match configured AI author lists. Skipping reviewer assignment.`
              );
              return;
            }

            reviewerUsers = reviewerUsers.filter((login) => login !== author);

            const requestedUsers = (pr.requested_reviewers || []).map((user) => user.login);
            const requestedTeams = (pr.requested_teams || []).map((team) => team.slug);

            reviewerUsers = reviewerUsers.filter((login) => !requestedUsers.includes(login));
            reviewerTeams = reviewerTeams.filter((slug) => !requestedTeams.includes(slug));

            if (!hasAny(reviewerUsers) && !hasAny(reviewerTeams)) {
              core.notice(
                `Route ${route} matched for ${author}, but no additional reviewer requests were needed.`
              );
              return;
            }

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              reviewers: reviewerUsers,
              team_reviewers: reviewerTeams,
            });

            core.notice(
              `Assigned AI reviewers for route ${route}. Users=[${reviewerUsers.join(', ')}] Teams=[${reviewerTeams.join(', ')}]`
            );
