name: Claude Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

jobs:
  skip-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      draft: ${{ steps.check.outputs.draft }}
      head_ref: ${{ steps.check.outputs.head_ref }}
      head_sha: ${{ steps.check.outputs.head_sha }}
    steps:
      - name: Inspect pull request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}")
          HEAD_SHA=$(printf '%s' "$PR_JSON" | jq -r .head.sha)
          HEAD_REF=$(printf '%s' "$PR_JSON" | jq -r .head.ref)
          DRAFT=$(printf '%s' "$PR_JSON" | jq -r .draft)

          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "head_ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"

          MESSAGE=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}" --jq .commit.message)
          if printf '%s' "$MESSAGE" | grep -F "[skip-review]" > /dev/null; then
            echo "Head commit carries [skip-review]; skipping review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  claude-review:
    needs: skip-check
    if: |
      needs.skip-check.outputs.skip != 'true' &&
      needs.skip-check.outputs.draft != 'true' &&
      startsWith(needs.skip-check.outputs.head_ref, 'codex/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ inputs.pr_number }}

            After posting the review, append the following line verbatim at the end of the review body so the original developer (Codex) is mentioned and can apply the fixes:

            @codex 上記のレビュー指摘を反映する修正コミットを作成してください。修正後の commit message には必ず `[skip-review]` を含めてください。
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
